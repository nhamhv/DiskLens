<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- DiskLens app icon: a treemap seen through a magnifying lens. Source for `npx tauri icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2d25"/>
      <stop offset="1" stop-color="#191310"/>
    </linearGradient>
    <linearGradient id="tileShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset="1" stop-color="#d9c3a5"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0bd72"/>
      <stop offset="1" stop-color="#b8692f"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lens"><circle cx="548" cy="470" r="178"/></clipPath>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background squircle (macOS Big Sur grid: 824px body on a 1024px canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>

  <g clip-path="url(#squircle)">
    <!-- Treemap, dimmed outside the lens -->
    <g opacity="0.55">
    <rect x="196" y="196" width="340" height="400" rx="22" fill="#a5603e"/>
    <rect x="552" y="196" width="276" height="220" rx="22" fill="#3d6f9a"/>
    <rect x="552" y="432" width="130" height="164" rx="22" fill="#5d7a55"/>
    <rect x="698" y="432" width="130" height="164" rx="22" fill="#6c5a92"/>
    <rect x="196" y="612" width="220" height="216" rx="22" fill="#9a7443"/>
    <rect x="432" y="612" width="200" height="216" rx="22" fill="#8a5478"/>
    <rect x="648" y="612" width="180" height="100" rx="22" fill="#4a7fa0"/>
    <rect x="648" y="728" width="180" height="100" rx="22" fill="#6f7a45"/>
    </g>

    <!-- Lens: shadow, magnified treemap, glass highlight, ring -->
    <line x1="676.16" y1="598.16" x2="790" y2="790" stroke="url(#handle)" stroke-width="78" stroke-linecap="round" filter="url(#shadow)"/>
    <circle cx="548" cy="470" r="202" fill="#000" opacity="0.35" filter="url(#shadow)"/>
    <g clip-path="url(#lens)">
      <rect x="370" y="292" width="356" height="356" fill="#1d1612"/>
      <g transform="translate(548 470) scale(1.6) translate(-548 -470)">
    <rect x="196" y="196" width="340" height="400" rx="22" fill="#a5603e"/>
    <rect x="552" y="196" width="276" height="220" rx="22" fill="#3d6f9a"/>
    <rect x="552" y="432" width="130" height="164" rx="22" fill="#5d7a55"/>
    <rect x="698" y="432" width="130" height="164" rx="22" fill="#6c5a92"/>
    <rect x="196" y="612" width="220" height="216" rx="22" fill="#9a7443"/>
    <rect x="432" y="612" width="200" height="216" rx="22" fill="#8a5478"/>
    <rect x="648" y="612" width="180" height="100" rx="22" fill="#4a7fa0"/>
    <rect x="648" y="728" width="180" height="100" rx="22" fill="#6f7a45"/>
      </g>
      <circle cx="548" cy="470" r="178" fill="url(#glass)"/>
    </g>
    <circle cx="548" cy="470" r="190" fill="none" stroke="url(#ring)" stroke-width="34"/>
    <!-- Specular glint -->
    <path d="M 430 408 A 128 128 0 0 1 508 342" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
